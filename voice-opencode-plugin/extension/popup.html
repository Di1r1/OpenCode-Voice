<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; width: 280px; }
    h3 { margin: 0 0 12px; font-size: 16px; color: #333; }
    .status { padding: 8px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
    .status.ok { background: #d1fae5; color: #065f46; }
    .status.error { background: #fee2e2; color: #991b1b; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; margin-bottom: 8px; }
    .btn.primary { background: #2563eb; color: white; }
    .btn.primary:hover { background: #1d4ed8; }
    .btn.secondary { background: #f3f4f6; color: #374151; }
    .btn.secondary:hover { background: #e5e7eb; }
    .info { font-size: 12px; color: #6b7280; margin-top: 12px; line-height: 1.5; }
    .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #374151; margin: 4px 0 8px; cursor: pointer; }
    .toggle input { width: 16px; height: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h3>🎤 OpenCode Voice</h3>
  <div id="status" class="status">Проверка...</div>
  <label class="toggle"><input type="checkbox" id="beeps"> Звуковые сигналы</label>
  <label class="toggle" style="display:block">Комбинация (удержание)
    <select id="hotkey"
      style="width:100%;padding:6px;margin-top:4px;border:1px solid #d1d5db;border-radius:6px;font-size:13px">
      <option value="alt+z">Alt+Z (по умолчанию)</option>
      <option value="ctrl+shift+z">Ctrl+Shift+Z</option>
      <option value="alt+q">Alt+Q</option>
      <option value="f9">F9</option>
    </select>
  </label>
  <label class="toggle"><input type="checkbox" id="sendHotkey"> Alt+X — запись и сразу отправка</label>
  <hr style="border:none;border-top:1px solid #e5e7eb;margin:12px 0">
  <label class="toggle"><input type="checkbox" id="tts"> 🔊 Озвучивать ответы ассистента</label>
  <label class="toggle" style="display:block">Движок озвучки
    <select id="ttsEngine"
      style="width:100%;padding:6px;margin-top:4px;border:1px solid #d1d5db;border-radius:6px;font-size:13px">
      <option value="browser">Браузер (Web Speech)</option>
      <option value="server">Сервер (Piper; нужен OPENCODE_VOICE_TTS=1)</option>
    </select>
  </label>
  <label class="toggle" style="display:block">Режим озвучки
    <select id="ttsMode"
      style="width:100%;padding:6px;margin-top:4px;border:1px solid #d1d5db;border-radius:6px;font-size:13px">
      <option value="brief">Кратко (первые предложения)</option>
      <option value="full">Полностью</option>
    </select>
  </label>
  <label class="toggle" style="display:block">Язык озвучки
    <select id="ttsLang"
      style="width:100%;padding:6px;margin-top:4px;border:1px solid #d1d5db;border-radius:6px;font-size:13px">
      <option value="auto">Авто (по тексту)</option>
      <option value="ru-RU">Русский</option>
      <option value="en-US">English</option>
      <option value="zh-CN">中文</option>
    </select>
  </label>
  <label class="toggle" style="display:block">Голос
    <select id="ttsVoice"
      style="width:100%;padding:6px;margin-top:4px;border:1px solid #d1d5db;border-radius:6px;font-size:13px">
      <option value="">Авто (по языку)</option>
    </select>
  </label>
  <label class="toggle"><input type="checkbox" id="ttsLocalOnly"> Только локальные голоса</label>
  <label class="toggle"><input type="checkbox" id="ttsDebug"> Лог в консоль (отладка)</label>
  <label class="toggle" style="display:block">Скорость: <span id="ttsRateVal">1.0</span>
    <input type="range" id="ttsRate" min="0.5" max="2" step="0.1" style="width:100%">
  </label>
  <div id="ttsStatus"
    style="font-size:11px;color:#6b7280;white-space:pre-wrap;margin-top:6px;line-height:1.35"></div>
  <label class="toggle" style="display:block">Токен доступа
    <input type="password" id="token" placeholder="OPENCODE_VOICE_TOKEN (необязательно)"
      style="width:100%;padding:6px;margin-top:4px;border:1px solid #d1d5db;border-radius:6px;font-size:13px">
  </label>
  <button id="beepTestBtn" class="btn secondary">🔔 Проверить звук</button>
  <button id="ttsTestBtn" class="btn secondary">🔊 Тест озвучки</button>
  <button id="testBtn" class="btn primary" disabled>Тест STT сервера</button>
  <button id="healBtn" class="btn secondary">🔧 Восстановить сервер</button>
  <button id="openBtn" class="btn secondary">Открыть настройки</button>
  <div class="info" id="versions"></div>
  <div class="info">
    Работает на <code>http://127.0.0.1:8765</code> (локальный STT-сервер).
    Установка и запуск — <code>./setup.sh</code>, диагностика — <code>doctor.sh</code>.
  </div>
  <script src="popup.js"></script>
</body>
</html>
