name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  plugin:
    name: Plugin (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-opencode-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voice-opencode-plugin/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Generate .opencode/plugins/index.ts and verify it is deterministic
        run: bash sync-plugin.sh && bash sync-plugin.sh --check

  server:
    name: STT server (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r voice-opencode-plugin/stt-server/requirements-dev.txt

      - name: Byte-compile the server
        run: python -m py_compile voice-opencode-plugin/stt-server/stt_server.py

      - name: Run tests
        working-directory: voice-opencode-plugin
        run: python -m pytest
