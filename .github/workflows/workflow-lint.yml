name: Workflow lint

# Separate file on purpose: a broken ci.yml cannot validate itself, so this
# workflow parses ALL workflow files (including ci.yml) on every push/PR.

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  yaml:
    name: Validate workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse all workflow files
        run: |
          python -m pip install --quiet "pyyaml==6.0.2"
          bash voice-opencode-plugin/check-workflows.sh
